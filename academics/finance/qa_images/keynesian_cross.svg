<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 450 330" width="450" height="330" font-family="Arial, sans-serif" font-size="13">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="440" height="330" fill="#ffffff"/>
<line x1="50" y1="260" x2="410" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="50" y1="260" x2="50" y2="15" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="405" y="282" fill="#111" text-anchor="end">Income Y</text>
<text x="12" y="12" fill="#111" text-anchor="start">Expenditure</text>
<line x1="50" y1="260" x2="290" y2="20" stroke="#555" stroke-width="2"/>
<text x="286" y="16" fill="#555" text-anchor="start">45° line: AE = Y</text>
<line x1="50" y1="200" x2="400" y2="25" stroke="#c0392b" stroke-width="2.5"/>
<line x1="250" y1="215" x2="280" y2="215" stroke="#c0392b" stroke-width="2.5"/><text x="286" y="220" fill="#c0392b" font-weight="bold">PE = (a + I + G) + bY</text>
<line x1="44" y1="200" x2="50" y2="200" stroke="#333" stroke-width="1.5"/><text x="42" y="204" fill="#c0392b" text-anchor="end" font-size="11">a+I+G</text>
<line x1="170" y1="140" x2="170" y2="260" stroke="#777" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="170" cy="140" r="4" fill="#111"/>
<text x="160" y="134" fill="#111" text-anchor="end" font-weight="bold">E</text>
<text x="170" y="276" fill="#111" text-anchor="middle">Y*</text>
<line x1="110" y1="170" x2="110" y2="200" stroke="#1e8449" stroke-width="3"/>
<line x1="110" y1="200" x2="110" y2="260" stroke="#777" stroke-width="1" stroke-dasharray="2 3"/>
<text x="110" y="276" fill="#111" text-anchor="middle">Y1</text>
<line x1="230" y1="80" x2="230" y2="110" stroke="#d35400" stroke-width="3"/>
<line x1="230" y1="110" x2="230" y2="260" stroke="#777" stroke-width="1" stroke-dasharray="2 3"/>
<text x="230" y="276" fill="#111" text-anchor="middle">Y2</text>
<text x="50" y="302" fill="#1e8449" text-anchor="start">At Y1: PE above the 45° line → stocks fall → firms produce more</text>
<text x="50" y="320" fill="#d35400" text-anchor="start">At Y2: PE below the 45° line → stocks pile up → firms produce less</text>
</svg>
