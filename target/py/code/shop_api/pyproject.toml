[project]
name = "shop-api"
version = "1.0.0"
description = "A small, realistic FastAPI backend used by the 'Reading a Python Backend' guide"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",          # SQLAlchemy's asyncio layer needs it
    "pydantic-settings>=2.0",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]   # TestClient is built on httpx

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
